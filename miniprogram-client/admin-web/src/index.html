<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>真好玩管理后台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="login-screen" class="login-screen">
      <form id="login-form" class="login-panel">
        <div>
          <p class="eyebrow">真好玩后台</p>
          <h1>真好玩管理后台</h1>
          <p class="muted">一期运营、审核、邀请、组局和局内消息证据工作台</p>
        </div>
        <label>
          账号
          <input id="login-username" autocomplete="username" />
        </label>
        <label>
          密码
          <input id="login-password" type="password" autocomplete="current-password" />
        </label>
        <button class="primary" type="submit">登录后台</button>
        <p id="login-error" class="error-text"></p>
      </form>
    </div>

    <div id="app-shell" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">真</span>
          <div>
            <strong>真好玩后台</strong>
            <small id="admin-role">未登录</small>
          </div>
        </div>
        <nav id="main-nav">
          <button data-view="dashboard" class="active">总览</button>
          <button data-view="users">用户管理</button>
          <button data-view="invites">邀请管理</button>
          <button data-view="games">组局管理</button>
        <button data-view="audits">角色审核</button>
          <button data-view="revenue">分润结算</button>
          <button data-view="redemption">积分兑换</button>
          <button data-view="members">会员团队</button>
          <button data-view="profiles">画像关系</button>
          <button data-view="growth">评价成长</button>
          <button data-view="reports">举报申诉</button>
          <button data-view="exports">导出中心</button>
          <button data-view="admins">后台账号</button>
          <button data-view="system">运营规则</button>
          <button data-view="im">局内消息证据</button>
          <button data-view="logs">操作日志</button>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p id="breadcrumb" class="eyebrow">总览</p>
            <h1 id="page-title">一期后台工作台</h1>
          </div>
          <div class="topbar-actions">
            <span id="api-status" class="status-dot pending">服务连接中</span>
            <button id="refresh-button" class="ghost" type="button">刷新</button>
            <button id="logout-button" class="ghost" type="button">退出</button>
          </div>
        </header>

        <section id="toast" class="toast hidden"></section>
        <section id="view-root" class="view-root"></section>
      </main>
    </div>

    <template id="dashboard-template">
      <div class="metric-grid">
        <article class="metric-card">
          <span>用户事件</span>
          <strong data-field="behaviorCount">0</strong>
          <small>小程序行为与后台操作输入</small>
        </article>
        <article class="metric-card">
          <span>组局数</span>
          <strong data-field="gameCount">0</strong>
          <small>普通局、标准局、条件局</small>
        </article>
        <article class="metric-card">
          <span>待审局</span>
          <strong data-field="pendingGameCount">0</strong>
          <small>后台审核后进入招募</small>
        </article>
        <article class="metric-card">
          <span>局内消息房间</span>
          <strong data-field="imRoomCount">0</strong>
          <small>房间、消息和争议证据</small>
        </article>
      </div>
      <div class="split">
        <section class="panel">
          <div class="panel-head"><h2>局型分布</h2></div>
          <div id="game-type-bars" class="bars"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>一期后台边界</h2></div>
          <ul class="check-list">
            <li>普通用户一期只能开普通局</li>
            <li>后台可创建普通局、标准局、公益局、均摊局、众筹局、押金局、条件局</li>
            <li>邀请入口覆盖小程序卡片、二维码、链接三种入口类型</li>
            <li>领路人、行家实名认证后才能承接对应身份</li>
          </ul>
        </section>
      </div>
    </template>

    <template id="users-template">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>用户列表</h2>
          </div>
          <form id="user-filter-form" class="filters">
            <input name="keyword" placeholder="昵称 / 手机尾号 / 用户" />
            <select name="realnameStatus">
              <option value="">全部实名状态</option>
              <option value="pending">待处理</option>
              <option value="phone_bound">已绑手机</option>
              <option value="verified">已实名</option>
              <option value="rejected">已驳回</option>
            </select>
            <select name="status">
              <option value="">全部账号状态</option>
              <option value="active">正常</option>
              <option value="disabled">已禁用</option>
            </select>
            <button class="ghost" type="submit">筛选</button>
          </form>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>用户</th>
                <th>用户来源</th>
                <th>昵称</th>
                <th>实名状态</th>
                <th>账号状态</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="users-table"></tbody>
          </table>
        </div>
      </section>
      <section id="user-detail-panel" class="panel hidden"></section>
    </template>

    <template id="invites-template">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>创建邀请码</h2>
            <p>支持小程序卡片、二维码、链接三种入口；后台生成的邀请码固定归属后台管理员，且每个邀请码只能使用一次。</p>
          </div>
        </div>
        <form id="invite-create-form" class="form-grid">
          <input name="code" type="hidden" value="" />
          <label>邀请入口
            <select name="entryType">
              <option value="poster">小程序卡片</option>
              <option value="qrcode">二维码</option>
              <option value="link">链接</option>
            </select>
          </label>
          <label>生成数量<input name="batchCount" inputmode="numeric" value="1" placeholder="1-200" /></label>
          <div class="form-note">系统自动生成邀请码，固定归属后台管理员，每个邀请码只能绑定一个微信用户。</div>
          <button class="primary" type="submit">生成邀请码</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>邀请码列表</h2>
          </div>
          <form id="invite-filter-form" class="filters">
            <select name="entryType">
              <option value="">全部入口</option>
              <option value="poster">小程序卡片</option>
              <option value="qrcode">二维码</option>
              <option value="link">链接</option>
            </select>
            <select name="status">
              <option value="">全部状态</option>
              <option value="active">正常</option>
              <option value="disabled">已禁用</option>
              <option value="exhausted">已用尽</option>
            </select>
            <button class="ghost" type="submit">筛选</button>
          </form>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>记录</th>
                <th>邀请码</th>
                <th>邀请入口</th>
                <th>状态</th>
                <th>使用状态</th>
                <th>使用用户</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="invite-codes-table"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>邀请关系</h2>
          </div>
          <form id="relation-filter-form" class="filters">
            <input name="inviteeUserId" inputmode="numeric" placeholder="被邀请用户" />
            <input name="inviteCodeId" inputmode="numeric" placeholder="邀请码" />
            <button class="ghost" type="submit">筛选</button>
          </form>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>邀请码</th>
                <th>被邀请用户</th>
                <th>绑定来源</th>
                <th>入口</th>
                <th>创建时间</th>
              </tr>
            </thead>
            <tbody id="invite-relations-table"></tbody>
          </table>
        </div>
      </section>
    </template>

    <template id="games-template">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>后台开局</h2>
            <p>小程序用户只能发起普通局；后台可按运营需要创建其他局型并开放招募。</p>
          </div>
        </div>
        <form id="game-create-form" class="form-grid">
          <label>主领路人<input name="mainGuideUserId" inputmode="numeric" placeholder="可为空，输入用户编号" /></label>
          <label>标题<input name="title" required maxlength="80" placeholder="例如：北京周末条件局" /></label>
          <label>发起人<input name="creatorUserId" required inputmode="numeric" placeholder="输入用户编号" /></label>
          <label>局型
            <select id="game-create-type-select" name="gameType">
              <option value="free">普通局</option>
              <option value="standard">标准局</option>
              <option value="public_welfare">公益局</option>
              <option value="aa">均摊局</option>
              <option value="crowdfund">众筹局</option>
              <option value="deposit">押金局</option>
              <option value="condition">条件局</option>
            </select>
          </label>
          <label>城市名称<input name="cityName" maxlength="64" placeholder="北京" /></label>
          <label>详细地址<input name="address" maxlength="255" placeholder="地点门牌或地图地址" /></label>
          <input name="cityCode" type="hidden" />
          <input name="longitude" type="hidden" />
          <input name="latitude" type="hidden" />
          <div class="map-search-box">
            <label>地点搜索<input id="game-map-keyword" placeholder="输入地点或地址关键词" /></label>
            <button id="game-map-search-button" class="ghost" type="button">搜索地点</button>
            <div id="game-map-results" class="map-search-results"></div>
          </div>
          <label>最少人数<input name="minPlayers" required inputmode="numeric" type="number" min="5" max="8" value="5" /></label>
          <label>最多人数<input name="maxPlayers" required inputmode="numeric" type="number" min="5" max="8" value="8" /></label>
          <button class="primary" type="submit">创建并开放招募</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>组局列表</h2>
          </div>
          <form id="game-filter-form" class="filters">
            <input name="keyword" placeholder="标题 / 城市" />
            <select id="game-filter-type-select" name="gameType">
              <option value="">全部局型</option>
              <option value="free">普通局</option>
              <option value="standard">标准局</option>
              <option value="public_welfare">公益局</option>
              <option value="aa">均摊局</option>
              <option value="crowdfund">众筹局</option>
              <option value="deposit">押金局</option>
              <option value="condition">条件局</option>
            </select>
            <select name="status">
              <option value="">全部状态</option>
              <option value="pending_audit">待审核</option>
              <option value="recruiting">招募中</option>
              <option value="in_progress">进行中</option>
              <option value="pending_review">待评价</option>
              <option value="completed">已完成</option>
            </select>
            <button class="ghost" type="submit">筛选</button>
          </form>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>组局</th>
                <th>标题</th>
                <th>局型</th>
                <th>创建方式</th>
                <th>状态</th>
                <th>人数</th>
                <th>城市</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="games-table"></tbody>
          </table>
        </div>
      </section>
      <section id="game-detail-panel" class="panel hidden"></section>
    </template>

    <template id="audits-template">
      <div class="split">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>认证记录查询</h2>
              <p>普通用户注册不进入人工审核；这里仅用于查看短信认证和实名记录。</p>
            </div>
            <button class="ghost" data-action="reload-identities" type="button">刷新</button>
          </div>
          <div id="identity-list" class="stack-list"></div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>行家/领路人申请</h2>
              <p>只处理行家、领路人等需要运营确认的身份申请。</p>
            </div>
            <button class="ghost" data-action="reload-roles" type="button">刷新</button>
          </div>
          <div id="role-list" class="stack-list"></div>
        </section>
      </div>
    </template>

    <template id="revenue-template">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>局型分润方案</h2>
          </div>
        </div>
        <form id="revenue-template-form" class="form-grid">
          <label>方案名称<input name="name" maxlength="64" value="默认方案" /></label>
          <label>局类型
            <select id="revenue-template-type-select" name="gameType">
              <option value="free">普通局</option>
              <option value="standard">标准局</option>
              <option value="public_welfare">公益局</option>
              <option value="aa">均摊局</option>
              <option value="crowdfund">众筹局</option>
              <option value="deposit">押金局</option>
              <option value="condition">条件局</option>
            </select>
          </label>
          <label>平台服务费比例<input name="platformBps" inputmode="decimal" value="10" placeholder="例如：10" /></label>
          <label>发起人收益比例<input name="creatorBps" inputmode="decimal" value="30" placeholder="例如：30" /></label>
          <label>参与人分配比例<input name="memberBps" inputmode="decimal" value="60" placeholder="例如：60" /></label>
          <div class="form-note">比例按百分比填写，普通局可配置为 0；收费局、押金局、条件局由后台提前配置。</div>
          <button class="primary" type="submit">保存方案</button>
        </form>
      </section>
      <div class="split">
        <section class="panel">
          <div class="panel-head"><h2>方案列表</h2></div>
          <div id="revenue-template-list" class="stack-list"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>分润规则</h2></div>
          <form id="revenue-rule-form" class="form-grid compact-grid">
            <label>所属方案<input id="revenue-rule-template-display" readonly placeholder="从左侧选择方案" /></label>
            <input name="templateId" type="hidden" required />
            <label>规则名称
              <select name="ruleCode">
                <option value="expert_bps">行家分润比例</option>
                <option value="guide_bps">领路人分润比例</option>
                <option value="freeze_days">冻结天数</option>
                <option value="min_amount">最低结算金额</option>
              </select>
            </label>
            <label>规则内容<input name="ruleValue" maxlength="128" placeholder="例如：20% 或 7天" /></label>
            <button class="ghost" type="submit">保存规则</button>
          </form>
          <div id="revenue-rule-list" class="stack-list"></div>
        </section>
      </div>
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>分润试算</h2>
          </div>
        </div>
        <form id="revenue-calc-form" class="form-grid">
          <label>组局<input name="gameId" required inputmode="numeric" placeholder="输入组局编号" /></label>
          <label>结算金额<input name="amountCent" required inputmode="numeric" value="0" /></label>
          <label>分润方案<input id="revenue-calc-template-display" readonly placeholder="从左侧方案选择" /></label>
          <input name="templateId" type="hidden" required />
          <label>发起人<input name="creatorUserId" inputmode="numeric" placeholder="发起人" /></label>
          <label>参与人<input name="memberIds" placeholder="多个用户用逗号分隔" /></label>
          <label>行家<input name="expertUserId" inputmode="numeric" placeholder="行家" /></label>
          <label>领路人<input name="guideUserId" inputmode="numeric" placeholder="领路人" /></label>
          <div class="form-note">试算用于财务核对，正式收益以组局完成后的系统结算记录为准。</div>
          <div class="row-actions form-actions">
            <button class="ghost" data-action="revenue-preview" type="button">试算</button>
            <button class="primary" data-action="revenue-generate" type="button">生成记录</button>
          </div>
        </form>
        <section id="revenue-preview-panel" class="sub-panel hidden"></section>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>分润记录</h2></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>举报单</th>
                <th>记录号</th>
                <th>组局</th>
                <th>分润方案</th>
                <th>金额</th>
                <th>状态</th>
                <th>明细</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="revenue-records-table"></tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>线下结算记录</h2></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>记录</th>
                <th>对应分润</th>
                <th>方式</th>
                <th>凭证号</th>
                <th>金额</th>
                <th>创建时间</th>
              </tr>
            </thead>
            <tbody id="revenue-settlements-table"></tbody>
          </table>
        </div>
      </section>
    </template>

    <template id="redemption-template">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>兑换商品</h2>
          </div>
        </div>
        <form id="redemption-item-form" class="form-grid">
          <label>商品名称<input name="name" maxlength="64" required placeholder="体验券" /></label>
          <label>描述<input name="description" maxlength="128" placeholder="兑换说明" /></label>
          <label class="span-2">商品图片<input name="imageUrl" maxlength="500" placeholder="填写已上传到 COS/CDN 的图片地址" /></label>
          <label>所需积分<input name="pointsCost" inputmode="numeric" required value="10" /></label>
          <label>库存<input name="stock" inputmode="numeric" required value="1" /></label>
          <button class="primary" type="submit">新增商品</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>商品</th>
                <th>图片地址</th>
                <th>名称</th>
                <th>所需积分</th>
                <th>库存</th>
                <th>状态</th>
                <th>更新时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="redemption-items-table"></tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>兑换订单</h2>
          </div>
          <button id="redemption-orders-refresh" class="ghost" type="button">刷新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>订单</th>
                <th>订单号</th>
                <th>用户</th>
                <th>商品</th>
                <th>所需积分</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="redemption-orders-table"></tbody>
          </table>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>积分流水</h2>
          </div>
          <button id="points-logs-refresh" class="ghost" type="button">刷新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>流水</th>
                <th>用户</th>
                <th>积分变动</th>
                <th>变动前/后</th>
                <th>业务</th>
                <th>原因</th>
                <th>创建时间</th>
              </tr>
            </thead>
            <tbody id="points-logs-table"></tbody>
          </table>
        </div>
      </section>
    </template>

    <template id="members-template">
      <div class="split">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>团队列表</h2>
            </div>
            <button id="member-teams-refresh" class="ghost" type="button">刷新</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>团队</th>
                  <th>团长</th>
                  <th>名称</th>
                  <th>状态</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="member-teams-table"></tbody>
            </table>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>会员报表</h2>
            </div>

          <button class="primary" type="submit">保存规则</button>
        </form>
        <div id="condition-rule-config-panel" class="detail-grid"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>角色权益展示</h2>
            <p>维护行家、领路人等角色入口提示和权益展示内容。</p>
          </div>
          <button id="role-benefit-refresh" class="ghost" type="button">刷新</button>
        </div>
        <form id="role-benefit-form" class="form-grid hidden" aria-hidden="true">
          <textarea id="role-benefit-config-json" name="configJson" rows="10" spellcheck="false"></textarea>
          <button class="primary" type="submit">保存展示</button>
        </form>
        <div id="role-benefit-config-panel" class="detail-grid"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>评价完成展示</h2>
            <p>维护评价完成后的权益展示和再玩意愿选项。</p>
          </div>
          <button id="review-complete-refresh" class="ghost" type="button">刷新</button>
        </div>
        <form id="review-complete-form" class="form-grid hidden" aria-hidden="true">
          <textarea id="review-complete-config-json" name="configJson" rows="10" spellcheck="false"></textarea>
          <button class="primary" type="submit">保存展示</button>
        </form>
        <div id="review-complete-config-panel" class="detail-grid"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>信用扣分规则</h2>
          <p>后台维护退出、低分评价、举报核实等扣分规则。</p>
          </div>
          <button id="credit-rule-refresh" class="ghost" type="button">刷新</button>
        </div>
        <form id="credit-rule-form" class="form-grid hidden" aria-hidden="true">
          <textarea id="credit-rule-config-json" name="configJson" rows="8" spellcheck="false"></textarea>
          <button class="primary" type="submit">保存规则</button>
        </form>
        <div id="credit-rule-config-panel" class="detail-grid"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>押金局规则</h2>
            <p>小程序发起组局页读取该配置展示押金局规则和支付提示。</p>
          </div>
          <button id="profit-config-refresh" class="ghost" type="button">刷新</button>
        </div>
        <form id="profit-config-form" class="form-grid">
          <label>押金规则说明<textarea name="depositRuleText" rows="4" maxlength="300"></textarea></label>
          <label>押金提示说明<textarea name="depositNoticeText" rows="4" maxlength="300"></textarea></label>
          <label>规则版本<input name="version" maxlength="32" placeholder="例如：2026-07" /></label>
          <button class="primary" type="submit">保存规则</button>
        </form>
        <div id="profit-config-panel" class="detail-grid"></div>
      </section>



      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>敏感词库</h2>
          </div>
        </div>
        <form id="sensitive-word-form" class="form-grid">
          <label>敏感词<input name="word" maxlength="80" required /></label>
          <label>等级
            <select name="level">
              <option value="high">高</option>
              <option value="medium">中</option>
              <option value="low">低</option>
            </select>
          </label>
          <label>处理方式
            <select name="action">
              <option value="block">直接拦截</option>
              <option value="flag">标记待查</option>
            </select>
          </label>
          <button class="primary" type="submit">新增敏感词</button>
        </form>
        <form id="sensitive-import-form" class="form-grid compact-grid">
          <label>批量敏感词<textarea name="words" rows="4" placeholder="每行一个词"></textarea></label>
          <button class="ghost" type="submit">批量导入</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>记录</th>
                <th>敏感词</th>
                <th>等级</th>
                <th>处理方式</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>管理</th>
              </tr>
            </thead>
            <tbody id="sensitive-words-table"></tbody>
          </table>
        </div>
      </section>

      <div class="split">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>内容风险日志</h2>
            </div>
            <button id="risk-logs-refresh" class="ghost" type="button">刷新</button>
          </div>
          <div id="risk-log-list" class="stack-list"></div>
        </section>
        <section class="panel hidden" aria-hidden="true">
          <div id="permission-tree-panel" class="stack-list"></div>
        </section>
      </div>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>数据留存开关</h2>
            <p>控制是否保留可用于推荐和复盘的业务数据，开启前请确认已取得用户授权。</p>
          </div>
          <div class="row-actions">
            <button class="ghost" data-action="ai-export-disable" type="button">关闭</button>
            <button class="primary" data-action="ai-export-enable" type="button">开启</button>
          </div>
        </div>
        <div id="ai-export-config-panel" class="detail-grid"></div>
      </section>
    </template>

    <template id="logs-template">
      <section class="panel">
        <div class="panel-head">
          <h2>操作日志</h2>
          <p>记录后台管理员的关键操作，仅超级管理员可查看全部日志，普通管理员只能查看自己的操作。</p>
          <button class="ghost" data-action="reload-logs" type="button">刷新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>操作内容</th>
                <th>关联业务</th>
                <th>管理员</th>
                <th>时间</th>
                <th>摘要</th>
              </tr>
            </thead>
            <tbody id="logs-table"></tbody>
          </table>
        </div>
      </section>
    </template>

    <script src="/main.js"></script>
  </body>
</html>
