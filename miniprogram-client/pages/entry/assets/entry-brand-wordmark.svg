<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110">
  <defs>
    <linearGradient id="replayFill" x1="0" y1="50" x2="360" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4ed8"/>
      <stop offset="0.42" stop-color="#9c4cff"/>
      <stop offset="0.72" stop-color="#3c8cff"/>
      <stop offset="1" stop-color="#20f4e7"/>
    </linearGradient>
    <linearGradient id="replayEdge" x1="0" y1="50" x2="360" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd8ff"/>
      <stop offset="0.5" stop-color="#dfcaff"/>
      <stop offset="1" stop-color="#b6fff8"/>
    </linearGradient>
    <filter id="replayGlow" x="-18%" y="-36%" width="136%" height="182%">
      <feGaussianBlur stdDeviation="7" result="outerBlur"/>
      <feColorMatrix in="outerBlur" type="matrix" values="1 0 0 0 0.75  0 1 0 0 0.24  0 0 1 0 0.94  0 0 0 0.82 0" result="outerGlow"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#replayGlow)" transform="skewX(-9)">
    <text
      x="18"
      y="76"
      fill="url(#replayFill)"
      stroke="#7c28d9"
      stroke-width="13"
      paint-order="stroke fill"
      font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif"
      font-size="68"
      font-weight="900"
      letter-spacing="-3"
      transform="scale(1 0.9)"
    >再玩一局</text>
    <text
      x="18"
      y="76"
      fill="url(#replayFill)"
      stroke="url(#replayEdge)"
      stroke-width="4"
      paint-order="stroke fill"
      font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif"
      font-size="68"
      font-weight="900"
      letter-spacing="-3"
      transform="scale(1 0.9)"
    >再玩一局</text>
  </g>
</svg>
