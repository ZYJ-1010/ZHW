<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>真好玩管理后台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="login-screen" class="login-screen">
      <section class="login-panel">
        <div class="login-copy">
          <p class="eyebrow">真好玩后台</p>
          <h1>真好玩管理后台</h1>
          <p class="muted">运营、审核、交易、数据和系统治理按管理员角色分区开放。</p>
        </div>
        <form id="login-form" class="login-form" data-login-content="login">
          <label>
            登录账号
            <input id="login-username" autocomplete="username" placeholder="例如：admin / finance" />
          </label>
          <label>
            密码
            <input id="login-password" type="password" autocomplete="current-password" />
          </label>
          <button class="primary" type="submit">登录后台</button>
          <p class="login-switch">还没有后台账号？<button class="link-button" data-login-panel="apply" type="button">申请管理员</button></p>
          <p id="login-error" class="error-text"></p>
        </form>
        <form id="admin-apply-form" class="login-form hidden" data-login-content="apply">
          <label>申请人姓名<input name="name" required maxlength="64" placeholder="填写真实姓名或岗位名" /></label>
          <label>联系方式<input name="contact" required maxlength="120" placeholder="手机号 / 微信 / 企业微信" /></label>
          <label>申请角色
            <select name="desiredRole" required>
              <option value="operation_manager">运营管理员</option>
              <option value="game_manager">组局管理员</option>
              <option value="user_manager">用户管理员</option>
              <option value="finance_manager">财务管理员</option>
              <option value="customer_manager">客服管理员</option>
              <option value="data_analyst">数据分析员</option>
            </select>
          </label>
          <label>申请说明<textarea name="reason" maxlength="500" placeholder="说明负责的岗位和需要处理的后台范围"></textarea></label>
          <button class="primary" type="submit">提交申请</button>
          <p class="login-switch">已有后台账号？<button class="link-button" data-login-panel="login" type="button">返回登录</button></p>
          <p id="admin-apply-result" class="form-result"></p>
        </form>
      </section>
    </div>

    <div id="app-shell" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">真</span>
          <div>
            <strong>真好玩后台</strong>
            <small id="admin-role">未登录</small>
          </div>
        </div>
        <nav id="main-nav">
          <section class="nav-section">
            <button class="nav-section-toggle" data-nav-group="operations" type="button">运营工作</button>
            <div class="nav-section-items" data-nav-items="operations">
              <button data-view="dashboard" class="active">总览</button>
              <button data-view="users">用户管理</button>
              <button data-view="invites">邀请管理</button>
              <button data-view="games">组局管理</button>
              <button data-view="audits">角色审核</button>
            </div>
          </section>
          <section class="nav-section">
            <button class="nav-section-toggle" data-nav-group="growth" type="button">交易与增长</button>
            <div class="nav-section-items" data-nav-items="growth">
              <button data-view="revenue">分润结算</button>
              <button data-view="redemption">积分兑换</button>
              <button data-view="members">会员团队</button>
              <button data-view="profiles">画像关系</button>
              <button data-view="growth">评价成长</button>
            </div>
          </section>
          <section class="nav-section">
            <button class="nav-section-toggle" data-nav-group="risk" type="button">风控与交付</button>
            <div class="nav-section-items" data-nav-items="risk">
              <button data-view="reports">举报申诉</button>
              <button data-view="exports">导出中心</button>
              <button data-view="analytics">数据分析</button>
              <button data-view="delivery">通知交付</button>
              <button data-view="im">局内消息证据</button>
            </div>
          </section>
          <section class="nav-section">
            <button class="nav-section-toggle" data-nav-group="system" type="button">系统治理</button>
            <div class="nav-section-items" data-nav-items="system">
              <button data-view="admins">后台账号</button>
              <button data-view="system">运营规则</button>
              <button data-view="logs">操作日志</button>
            </div>
          </section>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p id="breadcrumb" class="eyebrow">总览</p>
            <h1 id="page-title">一期后台工作台</h1>
          </div>
          <div class="topbar-actions">
            <span id="api-status" class="status-dot pending">服务连接中</span>
            <button id="refresh-button" class="ghost" type="button">刷新</button>
            <button id="logout-button" class="ghost" type="button">退出</button>
          </div>
        </header>

        <section id="toast" class="toast hidden"></section>
        <section id="view-root" class="view-root"></section>
      </main>
    </div>

    <template id="dashboard-template">
      <div class="metric-grid">
        <article class="metric-card">
          <span>用户事件</span>
          <strong data-field="behaviorCount">0</strong>
          <small>小程序行为与后台操作输入</small>
        </article>
        <article class="metric-card">
          <span>组局数</span>
          <strong data-field="gameCount">0</strong>
          <small>普通局、标准局、条件局</small>
        </article>
        <article class="metric-card">
          <span>待审局</span>
          <strong data-field="pendingGameCount">0</strong>
          <small>后台审核后进入招募</small>
        </article>
        <article class="metric-card">
          <span>局内消息房间</span>
          <strong data-field="imRoomCount">0</strong>
          <small>房间、消息和争议证据</small>
        </article>
      </div>
      <div class="split">
        <section class="panel">
          <div class="panel-head"><h2>局型分布</h2></div>
          <div id="game-type-bars" class="bars"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>组局状态</h2></div>
          <div id="game-status-bars" class="bars"></div>
        </section>
      </div>
      <div class="split">
        <section class="panel">
          <div class="panel-head"><h2>今日待办</h2></div>
          <div id="dashboard-work-queue" class="stack-list"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>管理员职责</h2></div>
          <div id="dashboard-permission-scope" class="stack-list"></div>
        </section>
      </div>
    </template>

    <template id="users-template">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>用户列表</h2>
          </div>
          <form id="user-filter-form" class="filters">
            <input name="keyword" placeholder="昵称 / 手机尾号 / 用户" />
            <select name="realnameStatus">
              <option value="">全部实名状态</option>
              <option value="pending">待处理</option>
              <option value="phone_bound">已绑手机</option>
              <option value="verified">已实名</option>
              <option value="rejected">已驳回</option>
            </select>
            <select name="status">
              <option value="">全部账号状态</option>
              <option value="active">正常</option>
              <option value="disabled">已禁用</option>
            </select>
            <button class="ghost" type="submit">筛选</button>
          </form>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>用户</th>
                <th>用户来源</th>
                <th>昵称</th>
                <th>邀请人</th>
                <th>实名状态</th>
                <th>账号状态</th>
                <th>创建时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="users-table"></tbody>
          </table>
        </div>
      </section>
    </template>

    <template id="invites-template">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>创建邀请码</h2>
            <p>支持小程序卡片、二维码、链接三种入口；创建时需要指定邀请人用户编号，每个邀请码只能使用一次。</p>
          </div>
        </div>
        <form id="invite-create-form" class="form-grid">
          <label>指定邀请码（可选）
            <input name="code" maxlength="32" placeholder="留空则自动生成；批量生成必须留空" />
          </label>
          <label>邀请人用户编号
            <input name="ownerUserId" inputmode="numeric" required placeholder="例如：91006" />
          </label>
          <label>邀请入口
            <select name="entryType">
              <option value="poster">小程序卡片</option>
              <option value="qrcode">二维码</option>
              <option value="link">链接</option>
            </select>
          </label>
          <label>生成数量<input name="batchCount" inputmode="numeric" value="1" placeholder="1-200" /></label>
          <div class="form-note">单个生成可填写固定邀请码；批量生成时系统自动生成，生成前会校验邀请人是否存在。</div>
          <button class="primary" type="submit">生成邀请码</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>邀请码列表</h2>
          </div>
          <form id="invite-filter-form" class="filters">
            <select name="entryType">
              <option value="">全部入口</option>
              <option value="poster">小程序卡片</option>
              <option value="qrcode">二维码</option>
              <option value="link">链接</option>
            </select>
            <select name="status">
              <option value="">全部状态</option>
              <option value="active">正常</option>
              <option value="disabled">已禁用</option>
              <option value="exhausted">已用尽</option>
            </select>
            <button class="ghost" type="submit">筛选</button>
          </form>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>记录</th>
                <th>邀请码</th>
                <th>邀请入口</th>
                <th>状态</th>
                <th>使用状态</th>
                <th>使用用户</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="invite-codes-table"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>邀请关系</h2>
          </div>
          <form id="relation-filter-form" class="filters">
            <input name="inviteeUserId" inputmode="numeric" placeholder="被邀请用户" />
            <input name="inviteCodeId" inputmode="numeric" placeholder="邀请码" />
            <button class="ghost" type="submit">筛选</button>
          </form>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>邀请码</th>
                <th>被邀请用户</th>
                <th>绑定来源</th>
                <th>入口</th>
                <th>创建时间</th>
              </tr>
            </thead>
            <tbody id="invite-relations-table"></tbody>
          </table>
        </div>
      </section>
    </template>

    <template id="games-template">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>后台开局</h2>
            <p>小程序用户只能发起普通局；后台可按运营需要创建其他局型并开放招募。</p>
          </div>
          <button id="open-game-create-drawer" class="primary" type="button">创建新局</button>
        </div>
        <form id="game-create-form" class="form-grid hidden">
          <label>主领路人（二期）<input inputmode="numeric" placeholder="暂不接入创建流程" disabled /></label>
          <label>标题<input name="title" required maxlength="80" placeholder="例如：北京周末条件局" /></label>
          <div class="field-with-hint">
            <label>发起人
              <select id="game-creator-select" name="creatorUserId" required>
                <option value="">正在加载用户...</option>
              </select>
            </label>
            <span id="game-creator-hint" class="muted">选择后将使用该用户编号创建局</span>
          </div>
          <label>局型
            <select id="game-create-type-select" name="gameType">
              <option value="free">普通局</option>
              <option value="standard">标准局</option>
              <option value="public_welfare">公益局</option>
              <option value="aa">均摊局</option>
              <option value="crowdfund">众筹局</option>
              <option value="deposit">押金局</option>
              <option value="condition">条件局</option>
            </select>
          </label>
          <div class="span-full cover-upload-field">
            <label>局封面<input name="coverImage" maxlength="500" placeholder="上传后自动填入 COS/CDN 封面地址，也可手动粘贴" /></label>
            <div class="cover-upload-actions">
              <input id="game-cover-file" accept="image/jpeg,image/png,image/webp" type="file" />
              <button id="game-cover-upload-button" class="ghost" type="button">上传封面</button>
              <span id="game-cover-upload-status" class="muted">支持 JPG/PNG/WEBP，不超过 10MB</span>
            </div>
            <div id="game-cover-preview" class="cover-upload-preview hidden"></div>
          </div>
          <label>城市名称<input name="cityName" maxlength="64" placeholder="北京" /></label>
          <label>详细地址<input name="address" maxlength="255" placeholder="地点门牌或地图地址" /></label>
          <label>报名开始时间<input name="signupStartAt" type="datetime-local" required /></label>
          <label>报名截止时间<input name="signupEndAt" type="datetime-local" required /></label>
          <label>组局开始时间<input name="startAt" type="datetime-local" required /></label>
          <label>组局结束时间<input name="endAt" type="datetime-local" required /></label>
          <input name="cityCode" type="hidden" />
          <input name="longitude" type="hidden" />
          <input name="latitude" type="hidden" />
          <div class="map-search-box">
            <label>地点搜索<input id="game-map-keyword" placeholder="输入地点或地址关键词" /></label>
            <button id="game-map-search-button" class="ghost" type="button">搜索地点</button>
            <div id="game-map-results" class="map-search-results"></div>
          </div>
          <label>最少人数<input name="minPlayers" required inputmode="numeric" type="number" min="5" max="8" value="5" /></label>
          <label>最多人数<input name="maxPlayers" required inputmode="numeric" type="number" min="5" max="8" value="8" /></label>
          <button class="primary" type="submit">创建并开放招募</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head panel-head-compact">
          <div>
            <h2>组局列表</h2>
            <p>按关键词、局型和状态筛选；批量审核只处理当前筛选结果中的待审核局。</p>
          </div>
        </div>
        <form id="game-filter-form" class="filters filter-strip">
          <input name="keyword" placeholder="标题 / 城市" />
          <select id="game-filter-type-select" name="gameType">
            <option value="">全部局型</option>
            <option value="free">普通局</option>
            <option value="standard">标准局</option>
            <option value="public_welfare">公益局</option>
            <option value="aa">均摊局</option>
            <option value="crowdfund">众筹局</option>
            <option value="deposit">押金局</option>
            <option value="condition">条件局</option>
          </select>
          <select name="status">
            <option value="">全部状态</option>
            <option value="pending_audit">待审核</option>
            <option value="recruiting">招募中</option>
            <option value="in_progress">进行中</option>
            <option value="pending_review">待评价</option>
            <option value="completed">已完成</option>
          </select>
          <button class="ghost" type="submit">筛选</button>
        </form>
        <div class="game-audit-toolbar">
          <label class="game-audit-select-all">
            <input id="game-audit-select-all" type="checkbox" aria-label="全选本页待审核组局" />
            <span>全选本页待审核</span>
          </label>
          <span id="game-audit-summary">当前页没有待审核局</span>
          <button id="game-batch-audit-button" class="ghost" type="button">批量通过已勾选</button>
          <button id="game-batch-reject-button" class="ghost danger" type="button">批量驳回已勾选</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>组局</th>
                <th>标题</th>
                <th>局型</th>
                <th>创建方式</th>
                <th>状态</th>
                <th>人数</th>
                <th>城市</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="games-table"></tbody>
          </table>
        </div>
      </section>
    </template>

    <template id="audits-template">
      <div class="section-tabs">
        <button class="active" data-tab-group="audits" data-tab-target="#audit-identities-panel" type="button">认证记录</button>
        <button data-tab-group="audits" data-tab-target="#audit-enterprise-panel" type="button">企业认证</button>
        <button data-tab-group="audits" data-tab-target="#audit-avatars-panel" type="button">头像审核</button>
        <button data-tab-group="audits" data-tab-target="#audit-roles-panel" type="button">行家/领路人申请</button>
      </div>
      <div class="view-root">
        <section id="audit-identities-panel" class="panel" data-tab-panel-group="audits">
          <div class="panel-head">
            <div>
              <h2>认证记录查询</h2>
              <p>一期实名认证由用户提交姓名和身份证号，后台人工审核通过后生效。</p>
            </div>
            <button class="ghost" data-action="reload-identities" type="button">刷新</button>
          </div>
          <div id="identity-list" class="stack-list"></div>
        </section>
        <section id="audit-enterprise-panel" class="panel hidden" data-tab-panel-group="audits">
          <div class="panel-head">
            <div>
              <h2>企业认证审核</h2>
              <p>用户提交营业执照和对公账户证明后，由后台人工审核。</p>
            </div>
            <button class="ghost" data-action="reload-enterprise-certifications" type="button">刷新</button>
          </div>
          <div id="enterprise-certification-list" class="stack-list"></div>
        </section>
        <section id="audit-avatars-panel" class="panel hidden" data-tab-panel-group="audits">
          <div class="panel-head">
            <div>
              <h2>头像审核</h2>
              <p>用户上传头像后先进入后台待审核，通过后才同步到个人头像。</p>
            </div>
            <button class="ghost" data-action="reload-avatar-audits" type="button">刷新</button>
          </div>
          <div id="avatar-audit-list" class="stack-list"></div>
        </section>
        <section id="audit-roles-panel" class="panel hidden" data-tab-panel-group="audits">
          <div class="panel-head">
            <div>
              <h2>行家/领路人申请</h2>
              <p>只处理行家、领路人等需要运营确认的身份申请。</p>
            </div>
            <button class="ghost" data-action="reload-roles" type="button">刷新</button>
          </div>
          <form id="role-grant-form" class="form-grid compact-grid">
            <label>用户 ID（可批量）<input name="userIds" placeholder="例如：12,15,18" required /></label>
            <label>直接赋予身份
              <select name="roleCode"><option value="expert">行家</option><option value="guide">领路人</option></select>
            </label>
            <label>开通原因<input name="reason" placeholder="例如：一期白名单开通" /></label>
            <button class="ghost" type="submit">白名单开通</button>
          </form>
          <div id="role-grant-result" class="hint" aria-live="polite"></div>
          <div id="role-list" class="stack-list"></div>
        </section>
      </div>
    </template>

    <template id="revenue-template">
      <div class="section-tabs" role="tablist" aria-label="分润结算模块">
        <button class="active" data-tab-group="revenue" data-tab-target="#revenue-plan-panel" type="button">方案规则</button>
        <button data-tab-group="revenue" data-tab-target="#revenue-calc-panel" type="button">分润试算</button>
        <button data-tab-group="revenue" data-tab-target="#revenue-records-panel" type="button">分润记录</button>
        <button data-tab-group="revenue" data-tab-target="#revenue-settlements-panel" type="button">线下结算</button>
      </div>
      <div id="revenue-plan-panel" data-tab-panel-group="revenue">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>局型分润方案</h2>
          </div>
        </div>
        <form id="revenue-template-form" class="form-grid">
          <label>方案名称<input name="name" maxlength="64" value="默认方案" /></label>
          <label>局类型
            <select id="revenue-template-type-select" name="gameType">
              <option value="free">普通局</option>
              <option value="standard">标准局</option>
              <option value="public_welfare">公益局</option>
              <option value="aa">均摊局</option>
              <option value="crowdfund">众筹局</option>
              <option value="deposit">押金局</option>
              <option value="condition">条件局</option>
            </select>
          </label>
          <label>平台服务费比例<input name="platformBps" inputmode="decimal" value="10" placeholder="例如：10" /></label>
          <label>发起人收益比例<input name="creatorBps" inputmode="decimal" value="30" placeholder="例如：30" /></label>

          <button class="primary" type="submit">新增敏感词</button>
        </form>
        <div class="form-note">等级说明：高风险用于违法、诈骗、色情、辱骂等必须拦截内容；中风险用于争议、擦边或需复核内容；低风险用于提醒类、观察类内容。</div>
        <form id="sensitive-import-form" class="form-grid compact-grid">
          <label>批量敏感词<textarea name="words" rows="4" placeholder="用空格或换行分隔多个词"></textarea></label>
          <button class="ghost" type="submit">批量导入</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>记录</th>
                <th>敏感词</th>
                <th>等级</th>
                <th>处理方式</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>管理</th>
              </tr>
            </thead>
            <tbody id="sensitive-words-table"></tbody>
          </table>
        </div>
      </section>

      <div id="system-risk-panel" class="split hidden" data-tab-panel-group="system">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>内容风险日志</h2>
            </div>
            <button id="risk-logs-refresh" class="ghost" type="button">刷新</button>
          </div>
          <div id="risk-log-list" class="stack-list"></div>
        </section>
        <section class="panel hidden" aria-hidden="true">
          <div id="permission-tree-panel" class="stack-list"></div>
        </section>
      </div>

      <section id="system-ai-export-panel" class="panel hidden" data-tab-panel-group="system">
        <div class="panel-head">
          <div>
            <h2>数据留存开关</h2>
            <p>控制是否保留可用于推荐和复盘的业务数据，开启前请确认已取得用户授权。</p>
          </div>
          <div class="row-actions">
            <button class="ghost" data-action="ai-export-disable" type="button">关闭</button>
            <button class="primary" data-action="ai-export-enable" type="button">开启</button>
          </div>
        </div>
        <div id="ai-export-config-panel" class="detail-grid"></div>
      </section>
    </template>

    <template id="logs-template">
      <section class="panel">
        <div class="panel-head">
          <h2>操作日志</h2>
          <p>记录后台管理员的关键操作，仅超级管理员可查看全部日志，普通管理员只能查看自己的操作。</p>
          <button class="ghost" data-action="reload-logs" type="button">刷新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>操作内容</th>
                <th>关联业务</th>
                <th>管理员</th>
                <th>时间</th>
                <th>摘要</th>
              </tr>
            </thead>
            <tbody id="logs-table"></tbody>
          </table>
        </div>
      </section>
    </template>

    <script src="/main.js"></script>
  </body>
</html>
