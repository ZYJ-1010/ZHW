openapi: 3.0.3
info:
  title: 鐪熷ソ鐜╁皬绋嬪簭绔?API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/app/role-applications/expert/config:
    get:
      summary: 获取行家申请表单配置
      description: 小程序行家申请页使用；配置来源为 system_configs.role.expert_apply_config，未配置时后端返回默认配置。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回 skillOptions、fields、uploadField、validationRules、yearOptions、serviceCount、priceHint
        "401":
          description: 未登录或登录失效
  /api/app/role-applications/guide/config:
    get:
      summary: 获取领路人申请表单配置
      description: 小程序领路人申请页使用；配置来源为 system_configs.role.guide_apply_config，未配置时后端返回默认配置。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回 requirements、planTask、perks、fields、uploadField、validationRules、serviceBlocks、serviceCount、priceHint
        "401":
          description: 未登录或登录失效
  /api/app/role-applications/status-config:
    get:
      summary: 获取角色审核状态页配置
      description: 小程序角色审核状态页使用；配置来源为 system_configs.role.status_page_config，控制审核进度、审核结果、驳回建议、成功动作等展示字段。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回 roleAliases、statusMap、roleMeta、pendingTimeline、approvedActions、texts、defaultRejectReasons、suggestionTemplates
        "401":
          description: 未登录或登录失效
  /api/app/role-applications/benefit-config:
    get:
      summary: 获取角色权益展示配置
      description: 小程序角色入口提示和权益对比页使用；配置来源为 system_configs.role.benefit_config，前端只绑定字段，不内置业务权益文案。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回 permissionPrompts、roleComparison、version。
        "401":
          description: 未登录或登录失效
  /api/app/notifications:
    get:
      summary: 鑾峰彇鎴戠殑绔欏唴閫氱煡
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 杩斿洖褰撳墠鐢ㄦ埛鐨勯€氱煡鍒楄〃锛屽寘鍚妇鎶ョ敵璇夊鐞嗐€佽瘎浠锋彁閱掔瓑绔欏唴閫氱煡
  /api/app/notifications/{notificationId}/read:
    post:
      summary: 鏍囪閫氱煡宸茶
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 閫氱煡鐘舵€佸彉涓?read
        "403":
          description: 鏃犳潈璇诲彇璇ラ€氱煡
  /api/app/behavior/events:
    post:
      summary: 涓婃姤鐢ㄦ埛琛屼负浜嬩欢
      description: Used for funnel and retention analytics; supports legacy and new behavior fields.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 杩斿洖 `BehaviorLogDTO`锛屽寘鍚?userId銆乪ventCode銆乥usinessType銆乥usinessId銆乻ource銆乨evice銆乮p銆乷ccurredAt
        "422":
          description: eventCode 鎴?eventType 涓嶈兘涓虹┖
  /health:
    get:
      summary: Service health check
      responses:
        "200":
          description: OK
  /api/app/auth/wechat-login:
    post:
      summary: 微信登录并绑定邀请关系
      description: 一期后端要求小程序只能通过邀请入口进入；登录请求必须携带 inviteCode。未绑定的邀请码进入注册模式，已绑定唯一微信的邀请码进入登录模式，其他微信使用该码会被拒绝；已注册微信通过新的唯一入口码进入时，会把该入口码绑定到当前微信并返回登录模式。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - inviteCode
              properties:
                code:
                  type: string
                  description: wx.login 返回 code；本地未配置 WECHAT_APP_ID/WECHAT_APP_SECRET 时使用 mock openid，生产配置后调用微信 jscode2session 换取 openid
                inviteCode:
                  type: string
                  description: 三种邀请入口携带的唯一邀请码
                entryType:
                  type: string
                  enum: [poster, qrcode, link]
                  description: 入口类型。poster 表示小程序分享卡片，qrcode 表示扫码邀请，link 表示微信聊天链接邀请
      responses:
        "200":
          description: 登录成功，返回 preAuthToken/token、CurrentUserDTO、entryType、authPageMode、boundWechat 和邀请关系
        "403":
          description: 缺少邀请码、邀请码无效、或邀请码已绑定其他微信
  /api/app/auth/phone-login:
    post:
      summary: 手机号验证码注册或登录
      description: 用户从有效邀请入口进入注册页后，以手机号和验证码创建账号；已存在并已绑定手机号的用户直接登录原账号。本阶段按产品确认暂时只接受验证码 000000，后续替换为真实短信校验。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  pattern: '^1[3-9][0-9]{9}$'
                  description: 11 位大陆手机号
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: 当前临时验证码为 000000
                inviteCode:
                  type: string
                  description: 新手机号注册时必填；已有手机号账号登录时可不传
                entryType:
                  type: string
                  enum: [poster, qrcode, link]
                  description: 邀请入口类型
      responses:
        "200":
          description: 注册或登录成功，返回正式 token、CurrentUserDTO、authPageMode、entryType 和邀请关系
        "403":
          description: 新用户缺少有效邀请码，或邀请码已失效、已绑定
        "422":
          description: 手机号格式或验证码无效
  /api/app/invites/precheck:
    post:
      summary: 邀请入口预检
      description: 小程序从分享卡片、二维码 scene 或微信链接取得 inviteCode 后先调用本接口，决定跳注册页还是登录页。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inviteCode
              properties:
                inviteCode:
                  type: string
                entryType:
                  type: string
                  enum: [poster, qrcode, link]
      responses:
        "200":
          description: 返回 valid、entryType、authPageMode(register/login)、boundWechat、boundUserId 和 inviteCode 信息
        "403":
          description: 邀请码缺失、无效、入口类型不匹配或已失效
  /api/app/invites/entries:
    post:
      summary: 生成邀请入口
      description: 登录用户生成一次性唯一邀请码，用于小程序分享卡片、二维码 scene 或微信聊天链接邀请。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entryType
              properties:
                entryType:
                  type: string
                  enum: [poster, qrcode, link]
                title:
                  type: string
                gameId:
                  type: integer
                  description: 生成某个局的分享卡片时传入；poster 卡片会返回局详情路径、默认标题和 game 基本信息
      responses:
        "200":
          description: 返回 inviteCode、entryType、path、scene、title、urlLink；带 gameId 时额外返回 game 基本信息。本地未配置 WECHAT_URL_LINK_BASE_URL 时 urlLink 为占位 scheme；生产配置后返回 HTTPS 链接并携带 inviteCode/entryType/path/query。
        "422":
          description: entryType 不是 poster/qrcode/link
  /api/app/users/me:
    get:
      summary: 鑾峰彇褰撳墠鐧诲綍鐢ㄦ埛
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 褰撳墠鐢ㄦ埛淇℃伅
        "401":
          description: 鏈櫥褰曟垨鐧诲綍澶辨晥
  /api/app/users/me/profile:
    put:
      summary: 鏇存柊褰撳墠鐢ㄦ埛璧勬枡
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  maxLength: 32
                avatarUrl:
                  type: string
                  maxLength: 500
                avatarFileId:
                  type: integer
                  format: int64
      responses:
        "200":
          description: 杩斿洖鏇存柊鍚庣殑鐢ㄦ埛璧勬枡
        "422":
          description: invalid nickname, avatarUrl or avatarFileId
  /api/app/identity/phone/bind:
    post:
      summary: bind phone
      security:
        - bearerAuth: []
      responses:
        "200":
          description: return identity status
  /api/app/sms/send-code:
    post:
      summary: send sms code
      description: 本地默认返回 mockCode=123456；生产环境必须配置 SMS_HTTP_ENDPOINT/SMS_HTTP_SECRET，接口只返回 provider/messageId，不回传验证码。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 本地返回 mockCode；生产返回短信发送结果，不包含验证码明文
  /api/app/sms/verify-code:
    post:
      summary: verify sms code
      security:
        - bearerAuth: []
      responses:
        "200":
          description: return identity status
  /api/app/identity/phone/verify:
    post:
      summary: submit manual realname verification or verify phone realname
      description: 一期未接入人身核验时，用户提交 realName 和 idCard 后进入 pending，后台审核通过后变为 verified；已完成短信验证的兼容旧流程会直接完成 phone_verified。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - realName
                - idCard
              properties:
                realName:
                  type: string
                idCard:
                  type: string
                  pattern: "^[1-9]\\d{5}(18|19|20)\\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])\\d{3}[\\dXx]$"
      responses:
        "200":
          description: return identity status
  /api/app/identity/faceid/detect-auth:
    post:
      summary: start faceid verification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: return faceToken from local mock or configured FACEID_HTTP_ENDPOINT
  /api/app/identity/faceid/callback:
    post:
      summary: faceid callback
      security:
        - bearerAuth: []
      responses:
        "200":
          description: return identity status
  /api/app/identity/faceid/result:
    post:
      summary: faceid result writeback
      security:
        - bearerAuth: []
      responses:
        "200":
          description: compatible with /api/app/identity/faceid/callback
  /api/app/identity/status:
    get:
      summary: get identity status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: return identity status
  /api/app/games:
    get:
      summary: 灞€鍒楄〃
      responses:
        "200":
          description: 返回小程序公开局列表；仅包含 recruiting、full、in_progress、pending_confirm、pending_review、completed，排除 pending_audit、draft、cancelled、closed。
    post:
      summary: 小程序端创建免费局
      description: 一期只允许创建免费局；人数必须为 5-8。玩家创建免费局只要求已登录并通过邀请进入，不再强制实名；领路人、行家角色能力仍按角色实名规则校验。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, gameType, minPlayers, maxPlayers]
              properties:
                title:
                  type: string
                  maxLength: 80
                gameType:
                  type: string
                  enum: [free]
                minPlayers:
                  type: integer
                  minimum: 5
                maxPlayers:
                  type: integer
                  maximum: 8
                cityCode:
                  type: string
                  maxLength: 32
                cityName:
                  type: string
                  maxLength: 64
                address:
                  type: string
                  maxLength: 255
                longitude:
                  type: number
                latitude:
                  type: number
      responses:
        "200":
          description: 创建成功，状态为 pending_audit；返回 Game，包含 mainGuideUserId（有主行家后返回）
        "401":
          description: 未登录或登录失效
        "422":
          description: 非免费局或人数规则错误
        "429":
          description: 每日创建超过 3 局
  /api/app/games/application-config:
    get:
      summary: 获取入局申请配置
      description: 小程序申请入局页使用；配置来源为 system_configs.game.application_config，后台可通过 /api/admin/games/application-config 维护。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回协议标题、协议文案、上传限制、简介长度、搜索开关等配置。
        "401":
          description: 未登录或登录失效
  /api/app/games/condition-rule-config:
    get:
      summary: 获取条件局规则配置
      description: 小程序展示条件局门槛使用；配置来源为 system_configs.game.condition_rule_config，后台可通过 /api/admin/games/condition-rule-config 维护。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回 enabled、visibleInMiniProgram、adminOnlyCreate、ruleItems、defaultVisibility 等配置。
        "401":
          description: 未登录或登录失效
  /api/app/games/cancel-config:
    get:
      summary: 获取取消赔付配置
      description: 小程序玩家/行家取消赔付页使用；配置来源为 system_configs.game.cancel_config。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回 player/expert 的 reasonOptions、defaultReason、agreementText 和 agreementItems。
        "401":
          description: 未登录或登录失效
  /api/app/game-invites/replay-context:
    get:
      summary: 获取再玩一局确认上下文
      description: 小程序评价完成后的“再玩一局”入口使用；quickActions 来源为 system_configs.game.replay_quick_actions，quickMessages 来源为 system_configs.game.replay_quick_messages，前端按 route 跳转到确认邀请、系统推荐或创建新局。
      security:
        - bearerAuth: []
      parameters:
        - name: sourceGameId
          in: query
          schema:
            type: integer
        - name: serviceOrderId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 返回 sourceGameId、serviceOrderId、inviter、previousSession、invitees、quickActions、quickMessages。
        "401":
          description: 未登录或登录失效
  /api/app/games/{gameId}:
    get:
      summary: 灞€璇︽儏
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 返回局详情；包含 myRelation、mainGuideUserId、im、review、serviceConfirm，以及 detailDisplay.statusText、pendingApplicationCount、可选组局者真实评分和后台生成的 primaryAction（text/disabled/action/route/confirmText）。
        "404":
          description: 局不存在
  /api/app/games/{gameId}/members:
    get:
      summary: 获取局成员列表
      description: 局成员或创建者可查看；成员 role 会返回 creator、main_guide 或 member，主行家由 mainGuideUserId 识别。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回 members，包含 userId、role、isCreator、isCurrentUser、confirmed
        "403":
          description: 非局成员不能查看
  /api/app/games/{gameId}/guide-invitations:
    post:
      summary: 邀请行家进入局
      description: 创建者或主行家可邀请其他行家；被邀请人必须完成实名后才能接受。首个通过邀请入局并被审核通过的行家会成为 main_guide。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回邀请记录
        "403":
          description: 无权邀请或被邀请行家未实名
  /api/app/game-invitations/{invitationId}/respond:
    post:
      summary: 响应局邀请
      description: 被邀请行家接受后生成 pending 入局申请，仍需创建者或主行家审核；接受邀请要求已实名。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回邀请记录和入局申请
        "403":
          description: 未实名或不是被邀请人
  /api/app/games/{gameId}/manual-start:
    post:
      summary: 手动开始局
      description: 仅创建者或主行家可操作；局人数必须达到 minPlayers，且一期 minPlayers 最少为 5、maxPlayers 最高为 8，未到 5 人不允许手动开始。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 局状态进入 in_progress
        "409":
          description: 当前状态不可开始或人数未达到 minPlayers
  /api/app/locations/current:
    post:
      summary: 淇濆瓨褰撳墠瀹氫綅
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 杩斿洖瀹氫綅璁板綍锛岀簿搴﹁秴杩?300m 鏃?accuracyWarning 涓?true
  /api/app/locations/manual:
    post:
      summary: 淇濆瓨鎵嬪姩瀹氫綅
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 杩斿洖瀹氫綅璁板綍
  /api/app/locations/my-recent:
    get:
      summary: My recent locations
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        "200":
          description: 杩斿洖褰撳墠鐢ㄦ埛鏈€杩戜繚瀛樼殑瀹氫綅璁板綍锛屼笉杩斿洖浠栦汉浣嶇疆
  /api/app/games/city:
    get:
      summary: 鍚屽煄灞€
      responses:
        "200":
          description: 鎸?cityCode 杩斿洖灞€鍒楄〃
  /api/app/games/nearby:
    get:
      summary: 闄勮繎灞€
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 鎸夊綋鍓嶄綅缃繑鍥炶窛绂昏寖鍥村唴鐨勫眬
  /api/app/map/search:
    get:
      summary: 腾讯地图地点搜索（后端代理）
      description: 小程序前端不使用腾讯位置服务 SDK、不绑定地图 Key 的 AppID；前端只请求本接口，后端使用 TENCENT_MAP_KEY_SERVER 调腾讯 WebService。
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 地点关键词
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: longitude
          in: query
          required: false
          schema:
            type: number
        - name: latitude
          in: query
          required: false
          schema:
            type: number
        - name: radiusMeter
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: 返回 provider=tencent、items、total；items 含 title/address/cityCode/cityName/longitude/latitude/distanceMeter
        "422":
          description: 地图请求参数错误
        "503":
          description: TENCENT_MAP_KEY_SERVER 未配置
  /api/app/map/geocode:
    get:
      summary: 腾讯地图地址转经纬度（后端代理）
      security:
        - bearerAuth: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: 返回 provider=tencent 和 place
        "422":
          description: 地图请求参数错误
        "503":
          description: TENCENT_MAP_KEY_SERVER 未配置
  /api/app/map/reverse-geocode:
    get:
      summary: 腾讯地图经纬度转地址（后端代理）
      security:
        - bearerAuth: []
      parameters:
        - name: longitude
          in: query
          required: true
          schema:
            type: number
        - name: latitude
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: 返回 provider=tencent 和 place
        "422":
          description: 地图请求参数错误
        "503":
          description: TENCENT_MAP_KEY_SERVER 未配置
  /api/app/map/route:
    get:
