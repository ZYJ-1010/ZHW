      description: 需要 ai:data:read 权限。用于一期后台查看用户、局、行为、收藏、评价、足迹、人脉、画像和 IM 留存数量，IM 内容只计数不导出；同时返回 5 个用户、3 个局、20 条行为、5 条收藏、5 条评价的验收阈值进度。
      responses:
        "200":
          description: 返回 AIDataSnapshotDTO
