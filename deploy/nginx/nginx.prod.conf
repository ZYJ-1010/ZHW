map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name haowan.net.cn www.haowan.net.cn api.haowan.net.cn admin.haowan.net.cn im.haowan.net.cn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name haowan.net.cn www.haowan.net.cn;

  ssl_certificate /etc/nginx/ssl/haowan.net.cn/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/haowan.net.cn/privkey.pem;

  return 302 https://admin.haowan.net.cn$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.haowan.net.cn;

  ssl_certificate /etc/nginx/ssl/haowan.net.cn/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/haowan.net.cn/privkey.pem;

  location / {
    proxy_pass http://go-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.haowan.net.cn;

  ssl_certificate /etc/nginx/ssl/haowan.net.cn/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/haowan.net.cn/privkey.pem;

  location /api/ {
    proxy_pass http://go-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    proxy_pass http://admin-web:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  server_name im.haowan.net.cn;

  ssl_certificate /etc/nginx/ssl/haowan.net.cn/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/haowan.net.cn/privkey.pem;

  location / {
    proxy_pass http://go-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
