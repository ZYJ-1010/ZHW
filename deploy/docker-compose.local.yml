services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zhw_mini
      POSTGRES_USER: zhw
      POSTGRES_PASSWORD: zhw
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zhw
      MINIO_ROOT_PASSWORD: change-me-123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
